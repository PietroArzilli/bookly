<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="white"/>

  <!-- Vertical stroke of the "b" -->
  <rect x="115" y="42" width="86" height="368" rx="43" fill="#0D4D5C"/>

  <!-- Outer circle (belly of "b") -->
  <circle cx="296" cy="328" r="172" fill="#0D4D5C"/>

  <!-- Inner white hole -->
  <circle cx="296" cy="328" r="110" fill="white"/>

  <!-- Calendar body -->
  <rect x="218" y="268" width="158" height="128" rx="16" fill="white"/>
  <!-- Coral header -->
  <rect x="218" y="268" width="158" height="50" rx="16" fill="#FF6B5B"/>
  <!-- Fill bottom of header (remove bottom radius) -->
  <rect x="218" y="296" width="158" height="22" fill="#FF6B5B"/>

  <!-- Ring clips -->
  <rect x="253" y="253" width="17" height="30" rx="8.5" fill="white"/>
  <rect x="326" y="253" width="17" height="30" rx="8.5" fill="white"/>
  <!-- Clip holes -->
  <rect x="258" y="260" width="7" height="16" rx="3.5" fill="#0D4D5C" opacity="0.5"/>
  <rect x="331" y="260" width="7" height="16" rx="3.5" fill="#0D4D5C" opacity="0.5"/>

  <!-- Clock face -->
  <circle cx="296" cy="352" r="43" fill="white"/>

  <!-- Tick marks (coral) -->
  <rect x="292" y="315" width="8" height="11" rx="4" fill="#FF6B5B"/>
  <rect x="292" y="378" width="8" height="11" rx="4" fill="#FF6B5B"/>
  <rect x="261" y="348" width="11" height="8" rx="4" fill="#FF6B5B"/>
  <rect x="320" y="348" width="11" height="8" rx="4" fill="#FF6B5B"/>

  <!-- Clock hands (teal) -->
  <line x1="296" y1="352" x2="296" y2="323" stroke="#0D4D5C" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="296" y1="352" x2="316" y2="366" stroke="#0D4D5C" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="296" cy="352" r="4" fill="#0D4D5C"/>
</svg>
